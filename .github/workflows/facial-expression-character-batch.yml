name: Chapter 2 — remaining six character expression sheets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/facial-expression-character-batch.yml'
      - 'scripts/r6_variant_textures.py'
      - 'scripts/r6_faces.py'
      - 'scripts/render_expression_sections.py'
      - 'scripts/build_expression_contact_sheet.py'
      - 'scripts/audit_expression_duplicates.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  character-expressions:
    name: ${{ matrix.actor }} — 13 EEVEE expressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        actor: [friend, teacher, dad, librarian, patron_green, patron_blue]
    env:
      ACTOR: ${{ matrix.actor }}
      OUT: render/${{ matrix.actor }}-expressions
    steps:
      - uses: actions/checkout@v4
      - name: Create partial-safe output directories
        run: mkdir -p "$OUT/stills" "$OUT/labelled"
      - name: Install Blender and image tools
        run: |
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -q "packages.microsoft.com" "$f"; then sudo mv "$f" "$f.disabled"; fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends blender python3-pil python3-numpy fonts-dejavu-core libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgbm1
      - name: Generate each character's own face artwork
        run: python3 scripts/library_character_assets.py
      - name: Validate render and QA scripts
        run: python3 -m py_compile scripts/render_expression_sections.py scripts/facial_expressions.py scripts/library_acting.py scripts/build_expression_contact_sheet.py scripts/audit_expression_duplicates.py
      - name: Render 13 expressions — EEVEE, 720p
        timeout-minutes: 15
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          blender -b --python-exit-code 1 --python scripts/render_expression_sections.py -- --section closeups --actor "$ACTOR" --engine BLENDER_EEVEE --width 1280 --height 720 --output "$OUT"
      - name: Build partial-safe contact sheet
        if: always()
        run: |
          label="$ACTOR"
          case "$ACTOR" in
            friend) label="Friend" ;;
            teacher) label="Teacher" ;;
            dad) label="Dad" ;;
            librarian) label="Librarian" ;;
            patron_green) label="Student Green" ;;
            patron_blue) label="Student Blue" ;;
          esac
          if compgen -G "$OUT/stills/*.png" > /dev/null; then
            python3 scripts/build_expression_contact_sheet.py --input "$OUT/stills" --actor "$ACTOR" --label "$label" --output "$OUT/${ACTOR}_expression_contact_sheet.png"
          else
            echo "CONTACT_SHEET_SKIPPED no stills completed for $ACTOR" | tee "$OUT/pilot_status.txt"
          fi
      - name: Pixel-compare all expression pairs
        if: always()
        run: |
          if compgen -G "$OUT/stills/*.png" > /dev/null; then
            python3 scripts/audit_expression_duplicates.py --input "$OUT/stills" --actor "$ACTOR" --output "$OUT/${ACTOR}_pixel_qa.json"
          else
            echo "PIXEL_QA_SKIPPED no stills completed for $ACTOR" | tee "$OUT/pixel_qa_status.txt"
          fi
      - name: Upload completed stills, contact sheet and QA even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-${{ matrix.actor }}-expression-sheet
          path: ${{ env.OUT }}/
          if-no-files-found: warn
          retention-days: 30

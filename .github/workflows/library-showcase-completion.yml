name: Production library showcase completion (reuse unchanged proofs)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/library-showcase-completion.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: library-showcase-completion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: [rooms, sky0, sky1, effects, clip0, clip1, clip2]
    steps:
      - uses: actions/checkout@v4
      - name: Install render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender ffmpeg python3-pil python3-numpy
      - name: Generate assets and render evidence
        env:
          JOB: ${{ matrix.job }}
        run: |
          echo '3a0f310faf09cf161f7036a4c0df1a20202b967683700badc4440309c0a7d95a  assets/r6_rigged.glb' | sha256sum -c -
          /usr/bin/python3 -m py_compile scripts/library_*.py scripts/render_library_showcase.py scripts/package_library_showcase.py
          /usr/bin/python3 scripts/library_character_assets.py
          blender -b --python-exit-code 1 --python scripts/render_library_showcase.py -- --job "$JOB" --output render/showcase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-${{ matrix.job }}
          path: render/showcase/
          if-no-files-found: warn
          retention-days: 7
  package:
    needs: render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: library-*
          path: chunks
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45919353390
          pattern: library-poses*
          path: chunks
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45919353390
          pattern: library-props*
          path: chunks
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45919353390
          name: library-characters
          path: chunks/library-characters
      - name: Validate and encode
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil python3-numpy fonts-dejavu-core
          /usr/bin/python3 scripts/package_library_showcase.py
      - uses: actions/upload-artifact@v4
        with:
          name: roblox-production-library-showcase
          path: showcase/
          retention-days: 7

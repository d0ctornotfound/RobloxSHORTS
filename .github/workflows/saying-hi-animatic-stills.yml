name: Saying Hi — independent held-pose animatic stills
on:
  push:
    branches: ['production/saying-hi']
    paths: ['.github/workflows/saying-hi-animatic-stills.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: saying-hi-animatic-stills
  cancel-in-progress: false
jobs:
  stills:
    if: github.ref == 'refs/heads/production/saying-hi'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        group: [0,1,2,3,4,5,6,7]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      R6_KNEE_BLEND: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install EEVEE and pinned plaza
        run: |
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -q "packages.microsoft.com" "$f"; then sudo mv "$f" "$f.disabled"; fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends blender python3-pil python3-numpy fonts-dejavu-core libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgbm1
          /usr/bin/python3 scripts/r6_faces.py --output assets/r6_faces
          /usr/bin/python3 scripts/library_character_assets.py
          mkdir -p /tmp/saying_hi_map
          curl --fail --location --retry 3 --max-time 180 'https://raw.githubusercontent.com/AdityapalW/Roblox-skill/54b34ba1be2e3013a9de59e40db288d8f2ebda53/Itlay/Itlay.gltf' -o /tmp/saying_hi_map/Itlay.gltf
          test "$(git hash-object /tmp/saying_hi_map/Itlay.gltf)" = '20108af3a19fae6b5beaa5fac2e3305b56112a41'
      - name: Render held poses in independent bounded Blender processes
        run: |
          python3 scripts/render_saying_hi_animatic_stills.py --group "${{ matrix.group }}" --groups 8 --map /tmp/saying_hi_map/Itlay.gltf --lineup assets/saying_hi_review/smoke/round3/lineup --output "review/stills"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saying-hi-stills-${{ matrix.group }}
          path: review/stills/
          if-no-files-found: warn
  publish:
    if: always() && github.ref == 'refs/heads/production/saying-hi'
    needs: stills
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/saying-hi
      - uses: actions/download-artifact@v4
        with:
          pattern: saying-hi-stills-*
          path: /tmp/saying-hi-stills
      - name: Publish actual held-pose results and partial logs
        run: |
          set -euo pipefail
          OUT=assets/saying_hi_review
          mkdir -p "$OUT/stills"
          for src in /tmp/saying-hi-stills/saying-hi-stills-*; do
            test -d "$src" || continue
            cp -a "$src"/. "$OUT/stills/"
          done
          printf 'workflow_run_id=%s\nsource_commit=%s\nstills_result=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ needs.stills.result }}" > "$OUT/stills/workflow_provenance.txt"
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          sha256sum stories/saying_hi_script.txt stories/saying_hi_plan.json >> "$OUT/SHA256SUMS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Publish actual held-pose animatic stills (partial if failed)"
          git pull --rebase origin production/saying-hi
          git push origin HEAD:refs/heads/production/saying-hi

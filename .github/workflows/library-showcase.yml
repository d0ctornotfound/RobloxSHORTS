name: Production library showcase (stills and proof clip)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-showcase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: [characters, poses0, poses1, poses2, props0, props1, props2, rooms, sky0, sky1, effects, clip0, clip1, clip2, clip3, clip4, clip5, import_walk, import_run]
    steps:
      - uses: actions/checkout@v4
      - name: Install render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender ffmpeg python3-pil python3-numpy
      - name: Generate assets and render evidence
        env:
          JOB: ${{ matrix.job }}
        run: |
          echo '3a0f310faf09cf161f7036a4c0df1a20202b967683700badc4440309c0a7d95a  assets/r6_rigged.glb' | sha256sum -c -
          /usr/bin/python3 scripts/library_character_assets.py
          blender -b --python-exit-code 1 --python scripts/render_library_showcase.py -- --job "$JOB" --output render/showcase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-${{ matrix.job }}
          path: render/showcase/
          if-no-files-found: warn
          retention-days: 7
  package:
    needs: render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: library-*
          path: chunks
      - name: Validate and encode
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil python3-numpy fonts-dejavu-core
          /usr/bin/python3 scripts/package_library_showcase.py
      - uses: actions/upload-artifact@v4
        with:
          name: roblox-production-library-showcase
          path: showcase/
          retention-days: 7

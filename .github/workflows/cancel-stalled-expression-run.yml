name: Cancel stalled original Chapter 2 render
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stalled-expression-run.yml'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  cancel-stalled-original:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel the stalled monolithic render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 46001234510 --repo d0ctornotfound/RobloxSHORTS || true
          gh run cancel 45998731264 --repo d0ctornotfound/RobloxSHORTS || true
          gh run cancel 46000804516 --repo d0ctornotfound/RobloxSHORTS || true
          gh run cancel 46001047312 --repo d0ctornotfound/RobloxSHORTS || true

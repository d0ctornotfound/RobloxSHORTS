name: Chapter 1 final one-sided hug and shoulder-lean fallback
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chapter1-hug-final.yml'
permissions:
  contents: read
jobs:
  geometry-and-conditional-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      R6_KNEE_BLEND: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -o Dir::Etc::sourceparts=/dev/null -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get install -y --no-install-recommends blender python3-pil python3-numpy ffmpeg fonts-dejavu-core
          /usr/bin/python3 scripts/library_character_assets.py
          python3 -m py_compile scripts/chapter1_hug_final.py scripts/render_chapter1_hug_final.py
      - name: Solve one-sided drape, then fallback if necessary
        run: blender -b --python-exit-code 1 --python scripts/render_chapter1_hug_final.py -- --motion hug --output render/geometry --geometry-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-round9-geometry-hug
          path: render/geometry/
          if-no-files-found: warn
      - name: Independently replay all 60 frames before rendering
        run: blender -b --python-exit-code 1 --python scripts/render_chapter1_hug_final.py -- --motion hug --output render/motion --plan render/geometry/geometry_plan.json
      - name: Encode and retain rendered evidence
        run: |
          mkdir -p render/review
          for dir in render/motion/*/; do
            name=$(basename "$dir")
            ffmpeg -v error -y -framerate 30 -i "$dir/frame_%04d.png" -c:v libx264 -crf 18 -pix_fmt yuv420p "render/review/$name.mp4"
            cp "$dir/metrics.json" "render/review/$name.json"
            for f in 0001 0012 0022 0025 0034 0045 0060; do cp "$dir/frame_$f.png" "render/review/${name}_$f.png"; done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter1-round9-render-hug
          path: |
            render/review/
            render/motion/replay_geometry.json
          if-no-files-found: ignore
      - name: Enforce performance after evidence upload
        run: python3 -c 'import json,glob; r=json.load(open(glob.glob("render/review/*.json")[0])); print(r["near_static"]); assert all(r["correction_gates"].values())'

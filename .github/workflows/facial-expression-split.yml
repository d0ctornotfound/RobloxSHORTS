name: Chapter 2 — split facial expression renders
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closeups:
    name: Expression close-ups — seven characters
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender, FFmpeg and image tools
        run: |
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -q "packages.microsoft.com" "$f"; then sudo mv "$f" "$f.disabled"; fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends blender ffmpeg python3-pil python3-numpy fonts-dejavu-core
      - name: Generate character-specific decal assets
        run: python3 scripts/library_character_assets.py
      - name: Render 91 expression close-ups
        run: |
          python3 -m py_compile scripts/render_expression_sections.py scripts/facial_expressions.py scripts/library_acting.py
          blender -b --python-exit-code 1 --python scripts/render_expression_sections.py -- --section closeups --output render/closeups
      - name: Encode close-up sequence and create contact sheets
        run: |
          ffmpeg -v error -y -framerate 24 -i render/closeups/expression_frames/frame_%06d.png -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart render/closeups/expression_closeups.mp4
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          root=Path("render/closeups")
          manifest=json.loads((root/"manifest.json").read_text())
          actors=manifest["characters"]
          font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",18)
          tile=(320,180)
          sheets=root/"expression_sheets";sheets.mkdir(exist_ok=True)
          master=Image.new("RGB",(160*13,90*7),(24,27,31))
          for row,actor in enumerate(actors):
              key=actor["key"];label=actor["label"];expressions=actor["expressions"]
              board=Image.new("RGB",(tile[0]*4,tile[1]*4),(24,27,31))
              for col,expr in enumerate(expressions):
                  im=Image.open(root/"labelled"/(key+"_"+expr+".png")).convert("RGB")
                  im=im.resize(tile,Image.Resampling.LANCZOS)
                  x=(col%4)*tile[0];y=(col//4)*tile[1]
                  board.paste(im,(x,y))
                  small=im.resize((160,90),Image.Resampling.LANCZOS)
                  master.paste(small,(col*160,row*90))
              ImageDraw.Draw(board).text((12,12),label,font=font,fill=(255,255,255))
              board.save(sheets/(key+".png"))
          master.save(root/"expression_master_contact_sheet.png")
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-expression-closeups
          path: |
            render/closeups/expression_closeups.mp4
            render/closeups/expression_master_contact_sheet.png
            render/closeups/expression_sheets/
            render/closeups/manifest.json
            render/closeups/labelled/
          if-no-files-found: error
          retention-days: 30

  blink-demo:
    name: Ten-second neutral blink demonstration
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender, FFmpeg and image tools
        run: |
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -q "packages.microsoft.com" "$f"; then sudo mv "$f" "$f.disabled"; fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends blender ffmpeg python3-pil python3-numpy fonts-dejavu-core
      - name: Generate character-specific decal assets
        run: python3 scripts/library_character_assets.py
      - name: Render ten-second blink demonstration
        run: |
          python3 -m py_compile scripts/render_expression_sections.py scripts/facial_expressions.py
          blender -b --python-exit-code 1 --python scripts/render_expression_sections.py -- --section blink --output render/blink
      - name: Encode blink demonstration and create event contact sheet
        run: |
          ffmpeg -v error -y -framerate 24 -i render/blink/blink_frames/frame_%06d.png -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart render/blink/neutral_blink_10s.mp4
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          root=Path("render/blink")
          manifest=json.loads((root/"manifest.json").read_text())
          schedules=manifest["neutral_blink_schedules"]
          actors=[("Lead","Reel Lead"),("Friend","Reel Friend"),("Teacher","Reel Teacher"),("Dad","Reel Dad"),("Librarian","Reel Librarian"),("Student Green","Reel Student Green"),("Student Blue","Reel Student Blue")]
          tile=(320,180);board=Image.new("RGB",(tile[0]*4,tile[1]*len(actors)),(24,27,31))
          font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",18)
          for row,(label,key) in enumerate(actors):
              events=schedules[key]
              if not events: raise RuntimeError("No blink schedule for "+key)
              frame=max(1,round(events[0]["start_seconds"]*24)+1)
              for col,number in enumerate((max(1,frame-1),frame,min(240,frame+1),min(240,frame+2))):
                  im=Image.open(root/"blink_frames"/("frame_%06d.png"%number)).convert("RGB").resize(tile,Image.Resampling.LANCZOS)
                  board.paste(im,(col*tile[0],row*tile[1]))
                  ImageDraw.Draw(board).text((col*tile[0]+8,row*tile[1]+8),label+" / frame "+str(number),font=font,fill=(255,255,255))
          board.save(root/"blink_event_contact_sheet.png")
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-neutral-blink-demo
          path: |
            render/blink/neutral_blink_10s.mp4
            render/blink/blink_event_contact_sheet.png
            render/blink/manifest.json
          if-no-files-found: error
          retention-days: 30

  beats:
    name: Paired emotional beats
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender, FFmpeg and image tools
        run: |
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -q "packages.microsoft.com" "$f"; then sudo mv "$f" "$f.disabled"; fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends blender ffmpeg python3-pil python3-numpy fonts-dejavu-core
      - name: Generate character-specific decal assets
        run: python3 scripts/library_character_assets.py
      - name: Render surprise-to-laugh and embarrassment performances
        run: |
          python3 -m py_compile scripts/render_expression_sections.py scripts/facial_expressions.py scripts/library_acting.py
          blender -b --python-exit-code 1 --python scripts/render_expression_sections.py -- --section beats --output render/beats
      - name: Encode paired beats and create contact sheet
        run: |
          ffmpeg -v error -y -framerate 24 -i render/beats/beat_frames/frame_%06d.png -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart render/beats/paired_emotional_beats.mp4
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          root=Path("render/beats")
          picks=[1,16,24,45,60,80,96,97,108,120,138,156]
          tile=(320,180);board=Image.new("RGB",(tile[0]*4,tile[1]*3),(24,27,31))
          font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",18)
          for i,number in enumerate(picks):
              im=Image.open(root/"beat_frames"/("frame_%06d.png"%number)).convert("RGB").resize(tile,Image.Resampling.LANCZOS)
              x=(i%4)*tile[0];y=(i//4)*tile[1];board.paste(im,(x,y))
              label=("Lead: neutral / surprise / laugh" if number<=96 else "Friend: neutral / embarrassed")
              ImageDraw.Draw(board).text((x+8,y+8),label+"  f"+str(number),font=font,fill=(255,255,255))
          board.save(root/"paired_beats_contact_sheet.png")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-paired-emotional-beats
          path: |
            render/beats/paired_emotional_beats.mp4
            render/beats/paired_beats_contact_sheet.png
            render/beats/manifest.json
          if-no-files-found: error
          retention-days: 30

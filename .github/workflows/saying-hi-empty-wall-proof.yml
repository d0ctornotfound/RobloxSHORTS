name: Saying Hi — verified empty-wall native proof
on:
  push:
    branches: ['production/saying-hi']
    paths: ['.github/workflows/saying-hi-empty-wall-proof.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: saying-hi-empty-wall-proof
  cancel-in-progress: false
jobs:
  render:
    if: github.ref == 'refs/heads/production/saying-hi'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      R6_KNEE_BLEND: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62f12141c9b9de5f8a5133985837822d9e535840
      - name: Require actual completed and inspected empty-wall smoke
        run: |
          gh run download 46103541527 --repo "$GITHUB_REPOSITORY" --name saying-hi-preflight-empty_wall --dir /tmp/wall-smoke
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/wall-smoke')
          m=json.loads((p/'manifest.json').read_text())
          assert m['unit']=='empty_wall' and m['mode']=='smoke' and m['actual_rendered_frames']==1
          assert (p/'held_pose.png').stat().st_size>0
          assert m['rendered'][0]['near_black_percent']<=10
          PY
      - name: Install proven EEVEE dependencies and pinned Itlay
        run: |
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -q "packages.microsoft.com" "$f"; then sudo mv "$f" "$f.disabled"; fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends blender ffmpeg python3-pil python3-numpy fonts-dejavu-core libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgbm1
          mkdir -p /tmp/saying_hi_map
          curl --fail --location --retry 3 --max-time 180 'https://raw.githubusercontent.com/AdityapalW/Roblox-skill/54b34ba1be2e3013a9de59e40db288d8f2ebda53/Itlay/Itlay.gltf' -o /tmp/saying_hi_map/Itlay.gltf
          test "$(git hash-object /tmp/saying_hi_map/Itlay.gltf)" = '20108af3a19fae6b5beaa5fac2e3305b56112a41'
      - name: Render and encode 42 native empty-wall samples
        run: |
          set -o pipefail
          mkdir -p review/empty_wall
          timeout --kill-after=20s 24m blender -b --python-exit-code 1 --python scripts/render_saying_hi_shot.py -- --unit empty_wall --mode motion --map /tmp/saying_hi_map/Itlay.gltf --lineup assets/saying_hi_review/smoke/round3/lineup --output review/empty_wall 2>&1 | tee review/empty_wall/render.log
          python3 scripts/encode_saying_hi_proof.py review/empty_wall
      - name: Preserve actual evidence and provenance
        if: always()
        run: |
          mkdir -p review/empty_wall
          python3 - <<'PY'
          from pathlib import Path
          import shutil,json,os
          p=Path('review/empty_wall');fs=sorted(p.glob('frame_*.png'))
          if fs:
              for i in sorted(set([0,len(fs)//2,len(fs)-1])):
                  shutil.copyfile(fs[i],p/('sample_'+fs[i].name))
          (p/'workflow_provenance.json').write_text(json.dumps({'workflow_run_id':os.environ['GITHUB_RUN_ID'],'render_source_commit':'62f12141c9b9de5f8a5133985837822d9e535840','smoke_run_id':46103541527,'scope':'empty wall only; source before later out-of-frame pair bench addition'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saying-hi-empty-wall-native
          path: |
            review/empty_wall/*.mp4
            review/empty_wall/*.json
            review/empty_wall/*.log
            review/empty_wall/sample_*.png
          if-no-files-found: warn
  publish:
    if: always() && github.ref == 'refs/heads/production/saying-hi'
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/saying-hi
      - uses: actions/download-artifact@v4
        with:
          name: saying-hi-empty-wall-native
          path: assets/saying_hi_review/proofs/empty_wall
      - name: Commit actual partial or completed native proof evidence
        run: |
          set -euo pipefail
          OUT=assets/saying_hi_review
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          sha256sum stories/saying_hi_script.txt stories/saying_hi_plan.json >> "$OUT/SHA256SUMS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Publish native empty-wall proof and exact render-rate evidence (partial if failed)"
          git pull --rebase origin production/saying-hi
          git push origin HEAD:refs/heads/production/saying-hi

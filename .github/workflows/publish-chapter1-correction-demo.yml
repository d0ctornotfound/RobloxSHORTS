name: Publish exact Chapter 1 correction reel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-chapter1-correction-demo.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45951573791
          name: chapter-1-character-correction-reel
          path: source-motion
      - name: Verify exact source and commit
        run: |
          mkdir -p demos
          cp source-motion/motion_reel.mp4 demos/chapter1_correction_reel.mp4
          cmp source-motion/motion_reel.mp4 demos/chapter1_correction_reel.mp4
          test "$(wc -c < demos/chapter1_correction_reel.mp4)" -eq 3052152
          echo 'f07d0a03a05779490c2e0ddf2ba6ec671505b1f6ebb393a3a88aefcb30511015  demos/chapter1_correction_reel.mp4' | sha256sum -c -
          test "$(git hash-object demos/chapter1_correction_reel.mp4)" = 5636cc83897ce88839c5ee5353c399743ebaef69
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- demos/chapter1_correction_reel.mp4
          git diff --cached --quiet || git commit -m "demos: publish exact original Chapter 1 correction reel (not approved)"
          git push origin HEAD:main
          git rev-parse HEAD
          git ls-tree -l HEAD demos/chapter1_correction_reel.mp4

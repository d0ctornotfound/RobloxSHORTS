name: Saying Hi — corrected native proof release
on:
  push:
    branches: ['production/saying-hi']
    paths: ['docs/saying_hi_correction_selection.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: saying-hi-correction-native
  cancel-in-progress: false
jobs:
  selection:
    if: github.ref == 'refs/heads/production/saying-hi'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        name: Require passed all-frame checks and explicitly reviewed diagnostics
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          plan=json.loads(Path('stories/saying_hi_plan.json').read_text())
          selection=json.loads(Path('docs/saying_hi_correction_selection.json').read_text())
          jobs=[]
          for unit,info in selection['units'].items():
              assert info['disposition']=='reviewed_pass'
              p=Path(info['geometry_path']);g=json.loads((p/'gate.json').read_text());m=json.loads((p/'manifest.json').read_text())
              ids=plan['proof_units'][unit];start=round(plan['shots'][ids[0]-1]['edit_in']*30);end=round(plan['shots'][ids[-1]-1]['edit_out']*30)
              assert g['pass'] is True and all(x['pass'] for x in g['checks'].values()) and g['samples']==end-start
              assert m['mode']=='smoke' and m['actual_rendered_frames']>0 and (p/'held_pose.png').is_file()
              for s in range(start,end,36):jobs.append({'unit':unit,'start':s,'end':min(s+36,end),'gate':str(p/'gate.json')})
          assert jobs, 'no approved units'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':jobs},separators=(',',':'))+'\n')
          PY
  render:
    needs: selection
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      R6_KNEE_BLEND: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install EEVEE and pinned Itlay
        run: |
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -q "packages.microsoft.com" "$f"; then sudo mv "$f" "$f.disabled"; fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends blender python3-pil python3-numpy fonts-dejavu-core libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgbm1
          /usr/bin/python3 scripts/r6_faces.py --output assets/r6_faces
          /usr/bin/python3 scripts/library_character_assets.py
          mkdir -p /tmp/saying_hi_map
          curl --fail --location --retry 3 --max-time 180 'https://raw.githubusercontent.com/AdityapalW/Roblox-skill/54b34ba1be2e3013a9de59e40db288d8f2ebda53/Itlay/Itlay.gltf' -o /tmp/saying_hi_map/Itlay.gltf
          test "$(git hash-object /tmp/saying_hi_map/Itlay.gltf)" = '20108af3a19fae6b5beaa5fac2e3305b56112a41'
      - name: Re-verify every geometry sample before native chunk
        run: |
          set -o pipefail
          mkdir -p review/chunk
          timeout --kill-after=20s 32m blender -b --python-exit-code 1 --python scripts/render_saying_hi_correction.py -- --unit "${{ matrix.unit }}" --mode motion --map /tmp/saying_hi_map/Itlay.gltf --lineup assets/saying_hi_review/smoke/round3/lineup --cache "${{ matrix.gate }}" --frame-window ${{ matrix.start }} ${{ matrix.end }} --output review/chunk 2>&1 | tee review/chunk/render.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correction-native-${{ matrix.unit }}-${{ matrix.start }}
          path: review/chunk/
          if-no-files-found: warn
  publish:
    needs: [selection, render]
    if: always() && needs.selection.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/saying-hi
      - uses: actions/download-artifact@v4
        with:
          pattern: correction-native-*
          path: /tmp/corrected-chunks
      - name: Merge contiguous native samples and validate actual output
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          OUT=assets/saying_hi_review/corrections/native
          mkdir -p "$OUT"
          failed=0
          for unit in $(python3 -c "import json;print(' '.join(json.load(open('docs/saying_hi_correction_selection.json'))['units']))"); do
            target="$OUT/$unit";mkdir -p "$target" "/tmp/merged/$unit"
            for dir in /tmp/corrected-chunks/correction-native-"$unit"-*; do
              test -d "$dir" || continue
              for file in render.log manifest.json gate.json; do
                if test -f "$dir/$file"; then cp "$dir/$file" "$target/${dir##*/}-$file"; fi
              done
            done
            if python3 scripts/merge_saying_hi_chart_chunks.py --root /tmp/corrected-chunks --unit "$unit" --out "/tmp/merged/$unit" && python3 scripts/encode_saying_hi_proof.py "/tmp/merged/$unit"; then
              cp /tmp/merged/"$unit"/*.json /tmp/merged/"$unit"/*.mp4 "$target/"
              python3 - "$unit" <<'PY'
          import sys,shutil
          from pathlib import Path
          unit=sys.argv[1];source=Path('/tmp/merged')/unit;target=Path('assets/saying_hi_review/corrections/native')/unit
          frames=sorted(source.glob('frame_*.png'))
          for i in sorted(set([0,len(frames)//4,len(frames)//2,3*len(frames)//4,len(frames)-1])):
              shutil.copyfile(frames[i],target/('sample_'+frames[i].name))
          PY
            else failed=1; fi
          done
          printf 'workflow_run_id=%s\nsource_commit=%s\nrender_result=%s\nmerge_failure=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ needs.render.result }}" "$failed" > "$OUT/workflow_provenance.txt"
          exit "$failed"
      - name: Commit actual completed or rejected proof evidence
        if: always()
        run: |
          set -euo pipefail
          OUT=assets/saying_hi_review
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          sha256sum stories/saying_hi_script.txt stories/saying_hi_plan.json >> "$OUT/SHA256SUMS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Publish corrected native proof clips and exact geometry evidence (partial if failed)"
          git pull --rebase origin production/saying-hi
          git push origin HEAD:refs/heads/production/saying-hi

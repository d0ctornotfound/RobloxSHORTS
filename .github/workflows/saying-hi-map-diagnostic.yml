name: Saying Hi — hold outdated preflight and inspect Itlay geometry
on:
  push:
    branches: ['production/saying-hi']
    paths: ['.github/workflows/saying-hi-map-diagnostic.yml']
permissions:
  contents: write
  actions: write
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/production/saying-hi'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Stop obsolete candidate proof run after visual rejection
        run: |
          status=$(gh run view 46102453329 --repo "$GITHUB_REPOSITORY" --json status --jq .status)
          if [ "$status" != completed ]; then gh run cancel 46102453329 --repo "$GITHUB_REPOSITORY"; fi
      - name: Extract source scene graph and exact named mesh metadata
        run: |
          mkdir -p /tmp/saying_hi_map assets/saying_hi_review/map_diagnostic
          curl --fail --location --retry 3 --max-time 180 'https://raw.githubusercontent.com/AdityapalW/Roblox-skill/54b34ba1be2e3013a9de59e40db288d8f2ebda53/Itlay/Itlay.gltf' -o /tmp/saying_hi_map/Itlay.gltf
          test "$(git hash-object /tmp/saying_hi_map/Itlay.gltf)" = '20108af3a19fae6b5beaa5fac2e3305b56112a41'
          python3 - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('/tmp/saying_hi_map/Itlay.gltf').read_text())
          meshes=g.get('meshes',[]);acc=g.get('accessors',[])
          def mesh(i):
              m=meshes[i]
              return {'name':m.get('name'),'position_bounds':[{'min':acc[p['attributes']['POSITION']].get('min'),'max':acc[p['attributes']['POSITION']].get('max'),'material':p.get('material')} for p in m.get('primitives',[]) if 'POSITION' in p.get('attributes',{})]}
          nodes=[]
          for i,n in enumerate(g.get('nodes',[])):
              row={k:v for k,v in n.items() if k in ('name','mesh','matrix','translation','rotation','scale','children')}
              row['index']=i
              if 'mesh' in row:row['mesh_metadata']=mesh(row['mesh'])
              nodes.append(row)
          out={'source_commit':'54b34ba1be2e3013a9de59e40db288d8f2ebda53','git_blob':'20108af3a19fae6b5beaa5fac2e3305b56112a41','scenes':g.get('scenes'),'nodes':nodes,'materials':[x.get('name') for x in g.get('materials',[])],'note':'Native glTF coordinates and local accessor bounds; apply node hierarchy/axis conversion before claiming Blender world positions.'}
          Path('assets/saying_hi_review/map_diagnostic/source_scene_graph.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          printf 'workflow_run_id=%s\nsource_commit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > assets/saying_hi_review/map_diagnostic/workflow_provenance.txt
      - name: Publish actual metadata
        run: |
          OUT=assets/saying_hi_review
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          sha256sum stories/saying_hi_script.txt stories/saying_hi_plan.json >> "$OUT/SHA256SUMS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Publish actual source glTF geometry metadata for fountain and wall restaging"
          git pull --rebase origin production/saying-hi
          git push origin HEAD:refs/heads/production/saying-hi

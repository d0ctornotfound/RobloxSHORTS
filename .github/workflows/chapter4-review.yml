name: Chapter 4 — Round 3 targeted review and PNG publication
on:
  push:
    branches: [main]
    paths:
      - 'scripts/chapter4_hair.py'
      - 'scripts/chapter4_wardrobe.py'
      - 'scripts/render_chapter4.py'
      - '.github/workflows/chapter4-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-item:
    name: ${{ matrix.actor }} / ${{ matrix.kind }} / ${{ matrix.item }} / ${{ matrix.motion }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - actor: teacher
            kind: hair
            item: default
            motion: none
          - actor: teacher
            kind: hair
            item: rounded_bob
            motion: none
          - actor: lead
            kind: outfit
            item: forest_bomber
            motion: none
          - actor: lead
            kind: clearance
            item: forest_bomber
            motion: walk
          - actor: lead
            kind: clearance
            item: forest_bomber
            motion: sit
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and dependencies
        run: |
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -q "packages.microsoft.com" "$f"; then sudo mv "$f" "$f.disabled"; fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends blender python3-pil python3-numpy fonts-dejavu-core libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgbm1
      - name: Generate identity assets
        run: python3 scripts/library_character_assets.py
      - name: Compile isolated candidate code
        run: python3 -m py_compile scripts/chapter4_hair.py scripts/chapter4_wardrobe.py scripts/render_chapter4.py
      - name: Render one item or clearance motion
        timeout-minutes: 25
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          R6_KNEE_BLEND: "1"
          ROLE: ${{ matrix.actor }}
          KIND: ${{ matrix.kind }}
          ITEM: ${{ matrix.item }}
          MOTION: ${{ matrix.motion }}
        run: |
          mkdir -p render/chapter4
          args=()
          if [ "$KIND" = clearance ]; then args+=(--motion "$MOTION"); fi
          timeout 23m blender -b --python-exit-code 1 --python scripts/render_chapter4.py -- --actor "$ROLE" --kind "$KIND" --item "$ITEM" --output render/chapter4 "${args[@]}"
      - name: Upload partial or complete actual renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter4-${{ matrix.actor }}-${{ matrix.kind }}-${{ matrix.item }}-${{ matrix.motion }}
          path: render/chapter4/
          if-no-files-found: warn
          retention-days: 30
  publish-boards:
    name: Publish complete round 2 and 3 PNG evidence to repository
    needs: render-item
    if: ${{ always() && needs.render-item.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download verified Round 2 source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 46096074284 --repo "${GITHUB_REPOSITORY}" --dir /tmp/ch4-r2
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/ch4-r3
          pattern: chapter4-*
      - name: Assemble PNG review boards and provenance
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/publish_chapter4_review.py /tmp/ch4-r2 /tmp/ch4-r3 "${GITHUB_RUN_ID}"
      - name: Commit verified PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/chapter4_review/
          git diff --cached --stat
          if git diff --cached --quiet; then echo "Boards already committed"; else
            git commit -m "Publish Chapter 4 Round 2 and 3 actual render PNG review boards"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git rev-parse HEAD
      - name: Upload review packet as supplementary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter4-review-published-pngs
          path: assets/chapter4_review/
          if-no-files-found: warn
